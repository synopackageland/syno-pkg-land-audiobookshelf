schema: 2
package: SynoPkgAudiobookshelf
version: 2.38.0
build: 1
displayname: Audiobookshelf
description: Organize and listen to your audiobooks and podcasts
maintainer: advplyr
metadata:
  changelog: {"en": "Update to Audiobookshelf 2.38.0 with library scan and access control fixes", "zh-TW": "更新至 Audiobookshelf 2.38.0，修正媒體庫掃描與存取控制問題", "zh-CN": "更新至 Audiobookshelf 2.38.0，修复媒体库扫描与访问控制问题", "ja": "Audiobookshelf 2.38.0 に更新（ライブラリースキャンとアクセス制御の問題を修正）", "ko": "Audiobookshelf 2.38.0으로 업데이트(라이브러리 스캔 및 액세스 제어 문제 수정)", "de": "Auf Audiobookshelf 2.38.0 mit Korrekturen für Bibliotheksscan und Zugriffskontrolle aktualisieren", "fr": "Mise à jour vers Audiobookshelf 2.38.0 avec corrections de l’analyse de bibliothèque et du contrôle d’accès", "es": "Actualización a Audiobookshelf 2.38.0 con correcciones del análisis de la biblioteca y del control de acceso", "it": "Aggiornamento a Audiobookshelf 2.38.0 con correzioni alla scansione della libreria e al controllo degli accessi"}
  maintainer_url: https://github.com/advplyr/audiobookshelf
  distributor: Syno Package Land
  distributor_url: https://synopkgland.com/
icon: assets/icon.png
os_min_ver: "7.2.1-69057"
arches: [x86_64]
entry: admin-only
capabilities: {composeMounts: true}
install:
  sharedFolder: {mode: select, key: media, permission: ro, picker: folder}
compose:
  sdk: 0.53.25
  shares:
    media:
      select: install
      picker: folder
      permission: ro
      mounts: [{service: web, target: /media}]
  files: [compose.yaml, compose.image.yaml]
  services:
    web:
      network: host
      address_env: HOST
      scratch: [/tmp]
      storage_init:
        directories:
          - {base: /var/tmp, path: audiobookshelf}
          - {base: /var/tmp, path: audiobookshelf/config}
          - {base: /var/tmp, path: audiobookshelf/metadata}
        runtime:
          environment:
            ABS_OIDC_SECRET: {oidc_client: audiobookshelf}
            ABS_BOOTSTRAP_PASSWORD: {secret: bootstrap}
  web: {service: web, port: 13378, health: {path: /healthcheck, status: 200}}
  network: {egress: internet}
identity_gateway:
  upstream_auth_paths: [/feed, /public, /hls, /socket.io, /status, /auth/refresh, /api]
  sdk: 0.53.25
  mode: oidc
  access: dsm-admins
  ingress: {path: /audiobookshelf/}
  roles: {admin: admin, user: user}
  oidc:
    issuer_port: 13380
    clients:
      - id: audiobookshelf
        redirect_paths: [/auth/openid/callback]
        pkce: true
ui: {launch: new-page}
i18n:
  info:
    zh-TW:
      description: 整理與收聽你的有聲書和 Podcast
