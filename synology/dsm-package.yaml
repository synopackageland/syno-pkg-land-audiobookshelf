schema: 2
package: SynoPkgAudiobookshelf
version: 2.37.2
build: 12
displayname: Audiobookshelf
description: Organize and listen to your audiobooks and podcasts
maintainer: advplyr
metadata:
  changelog: {"en": "Keep temporary files on disk instead of memory", "zh-TW": "暫存檔改存於磁碟而非記憶體", "zh-CN": "临时文件改存于磁盘而非内存", "ja": "一時ファイルをメモリーではなくディスクに保存", "ko": "임시 파일을 메모리 대신 디스크에 저장", "de": "Temporäre Dateien auf dem Datenträger statt im Arbeitsspeicher ablegen", "fr": "Conserver les fichiers temporaires sur le disque plutôt qu’en mémoire", "es": "Guardar los archivos temporales en el disco en lugar de en la memoria", "it": "Conservare i file temporanei su disco anziché in memoria"}
  maintainer_url: https://github.com/advplyr/audiobookshelf
  distributor: Syno Package Land
  distributor_url: https://synopkgland.com/
icon: assets/icon.png
os_min_ver: "7.2.1-69057"
arches: [x86_64]
entry: admin-only
capabilities: {composeMounts: true}
install:
  sharedFolder: {mode: select, key: media, permission: ro, picker: folder}
compose:
  sdk: 0.53.25
  shares:
    media:
      select: install
      picker: folder
      permission: ro
      mounts: [{service: web, target: /media}]
  files: [compose.yaml, compose.image.yaml]
  services:
    web:
      network: host
      address_env: HOST
      scratch: [/tmp]
      storage_init:
        directories:
          - {base: /var/tmp, path: audiobookshelf}
          - {base: /var/tmp, path: audiobookshelf/config}
          - {base: /var/tmp, path: audiobookshelf/metadata}
        runtime:
          environment:
            ABS_OIDC_SECRET: {oidc_client: audiobookshelf}
            ABS_BOOTSTRAP_PASSWORD: {secret: bootstrap}
  web: {service: web, port: 13378, health: {path: /healthcheck, status: 200}}
  network: {egress: internet}
identity_gateway:
  upstream_auth_paths: [/feed, /public, /hls, /socket.io, /status, /auth/refresh, /api]
  sdk: 0.53.25
  mode: oidc
  access: dsm-admins
  ingress: {path: /audiobookshelf/}
  roles: {admin: admin, user: user}
  oidc:
    issuer_port: 13380
    clients:
      - id: audiobookshelf
        redirect_paths: [/auth/openid/callback]
        pkce: true
ui: {launch: new-page}
i18n:
  info:
    zh-TW:
      description: 整理與收聽你的有聲書和 Podcast
